services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TEST_POSTGRES_DB: ${TEST_POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Object storage compatível com S3 (RustFS). Substituiu o MinIO, cujas
  # imagens foram removidas dos registros públicos em setembro de 2026.
  storage:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  storage-init:
    build: .
    env_file: .env
    environment:
      MINIO_INTERNAL_ENDPOINT: storage:9000
    command: uv run python -m scripts.create_bucket
    restart: "no"
    depends_on:
      storage:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      MINIO_INTERNAL_ENDPOINT: storage:9000
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  celery-worker:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      MINIO_INTERNAL_ENDPOINT: storage:9000
      REDIS_URL: redis://redis:6379/0
    command: uv run celery -A app.core.celery_app worker --loglevel=info
    volumes:
      - ./app:/app/app
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  celery-beat:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      MINIO_INTERNAL_ENDPOINT: storage:9000
      REDIS_URL: redis://redis:6379/0
    command: uv run celery -A app.core.celery_app beat --loglevel=info
    volumes:
      - ./app:/app/app
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

volumes:
  postgres_data:
  storage_data:
